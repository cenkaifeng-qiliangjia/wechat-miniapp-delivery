name: Validate skill suite

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate repository
        run: python3 scripts/validate_repo.py
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.2.0 validate --all --strict --no-interactive
      - name: Run skill behavior evals
        run: python3 scripts/run_skill_evals.py
      - name: Test installers
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test local installer
        run: |
          python3 scripts/install_skill.py \
            --target codex \
            --dest "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/wechat-miniapp-delivery/SKILL.md"
          test -f "$RUNNER_TEMP/skills/wechat-miniapp-design/SKILL.md"
